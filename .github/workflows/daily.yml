# Generates today's directory, opens a PR that adds it to data/generated.json,
# and merges it. The seed is a hash of the date, so a rerun on the same day
# finds nothing new and stops. Needs "Allow GitHub Actions to create and
# approve pull requests" (Settings, Actions, General).
name: Today's directory

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-directory
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate today's directory
        id: gen
        run: node scripts/daily.js

      # A PR opened with GITHUB_TOKEN doesn't trigger the test workflow, so the
      # tests run here, before anything is pushed.
      - name: Test
        run: npm test

      - name: Open and merge the PR
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: daily/${{ steps.gen.outputs.date }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add data/generated.json
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$open_pr" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr edit "$open_pr" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr merge "$BRANCH" --squash --delete-branch --auto || gh pr merge "$BRANCH" --squash --delete-branch
